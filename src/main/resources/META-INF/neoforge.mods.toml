modLoader = "javafml"
loaderVersion = "[1,)"
license = "LGPLv3"

[[mods]]
modId = "mafglib"
version = "${version}"
displayName = "MaFgLib"
displayURL="https://github.com/ThinkingStudios/MaLiLib-Forge" #optional
logoFile="icon.png" #optional
credits="masa" #optional
authors="TexTrue, ThinkingStudio" #optional
description = '''
MaLiLib unofficial (Neo)Forge port.

Library mod for the (Neo)Forge port of masa's mods.
'''

[[mods]]
modId = "mafglib_special"
version = "0.1.0"
displayName = "MaFgLib Special Config"
logoFile="icon.png" #optional
description = '''
MaFgLib Special Config
'''

[[mixins]]
config = "mafglib.mixins.json"

[[dependencies.mafglib]]
modId = "neoforge"
type = "required"
versionRange = "[21,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mafglib]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.2,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.mafglib]]
modId = "badpackets"
type = "required"
versionRange = "[0.8.1,)"
ordering = "NONE"
side = "BOTH"

[entrypoints.mafglib]
modmenu = [ "fi.dy.masa.malilib.compat.modmenu.ModMenuImpl" ]
